[package]
name = "feeling-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
feelrel-linux-adapter = { path = "../feelrel-linux-adapter" }
feelrel-ports = { path = "../feelrel-ports" }
feelrel-slpi-adapter = { path = "../feelrel-slpi-adapter" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", features = ["net", "rt", "time"] }
tempfile = "3"
toml = "1"
